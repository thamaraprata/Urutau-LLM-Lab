version: '3.8'

services:
  app:
    build: .
    container_name: urutau-llm-lab
    ports:
      - "5000:5000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - DATABASE_PATH=/app/data/urutau.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - urutau-net

  ollama:
    image: ollama/ollama:latest
    container_name: urutau-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - urutau-net

volumes:
  ollama-data:
    driver: local

networks:
  urutau-net:
    driver: bridge
