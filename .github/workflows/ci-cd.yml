name: CI/CD - UrutauLLM-Lab

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 1) Qualidade + testes
  # ---------------------------------------------------------------
  lint-test:
    name: Lint & Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      - name: Lint (flake8)
        run: flake8 . --max-line-length=120 --exclude=.git,__pycache__,venv

      - name: Testes (pytest)
        run: pytest tests/ -v --cov=. --cov-report=term-missing

  # ---------------------------------------------------------------
  # 2) Segurança ESTÁTICA (SAST, SCA, secrets)
  # ---------------------------------------------------------------
  sast:
    name: SAST (CodeQL + Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analisar com CodeQL
        uses: github/codeql-action/analyze@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lab é intencionalmente vulnerável: --exit-zero mostra os achados sem quebrar o pipeline
      - name: Bandit
        run: |
          pip install bandit
          bandit -r . -x ./tests,./venv -ll --exit-zero

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Auditar dependências
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

  secrets-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------
  # 3) Build da imagem + scan de container (Trivy)
  # ---------------------------------------------------------------
  build:
    name: Build & Scan da imagem
    runs-on: ubuntu-latest
    needs: [lint-test, sast, sca, secrets-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem em minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy (vulnerabilidades da imagem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"   # mude para "1" para bloquear em falhas

      - name: Login no GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  # ---------------------------------------------------------------
  # 4) Segurança DINÂMICA (DAST com OWASP ZAP)
  # ---------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Subir a aplicação
        run: |
          docker build -t urutau-app:test .
          docker run -d --name app -p 5000:5000 urutau-app:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ && break || sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:5000
          fail_action: false
          allow_issue_writing: false

      - name: Logs do container (se falhar)
        if: failure()
        run: docker logs app

  # ---------------------------------------------------------------
  # 5) Deploy - AMBIENTE 1: staging
  # ---------------------------------------------------------------
  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-latest
    needs: [build, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.exemplo.com
    steps:
      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Deploy da imagem ${GITHUB_SHA} em STAGING"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "DEPLOY_HOOK_URL não configurado - deploy simulado."
          fi

      - name: Smoke test
        run: echo "curl -f https://staging.exemplo.com/ (ajuste para sua URL real)"

  # ---------------------------------------------------------------
  # 6) Deploy - AMBIENTE 2: production (com aprovação manual)
  # ---------------------------------------------------------------
  deploy-production:
    name: Deploy (production)
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: https://producao.exemplo.com
    steps:
      - name: Deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          echo "Deploy da imagem ${GITHUB_SHA} em PRODUÇÃO"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          else
            echo "DEPLOY_HOOK_URL não configurado - deploy simulado."
          fi
